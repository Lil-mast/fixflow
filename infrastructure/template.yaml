AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  FixFlow - serverless civic issue reporting. Phase 3 adds the Step Functions report
  workflow, the Cognito-protected admin review endpoint, and transactional review
  callbacks.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Deployment stage name. Also used in resource names.

  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: >-
      Exact browser origin allowed to call the API and upload evidence. In production,
      set this to the CloudFront URL after the first deployment (no trailing slash).

  WebUrl:
    Type: String
    Default: http://localhost:5173
    Description: >-
      Public frontend base URL used to build tracking links. Set this to the CloudFront
      URL after the first deployment.

  ReviewTimeoutSeconds:
    Type: Number
    Default: 259200
    MinValue: 60
    MaxValue: 1209600
    Description: >-
      How long the review task waits before expiring and issuing a fresh token. The
      default is 72 hours.

  CognitoDomainPrefix:
    Type: String
    Default: ""
    Description: >-
      Globally unique Cognito hosted UI prefix. Leave blank to use
      fixflow-<account id>.

Conditions:
  UseGeneratedCognitoDomain: !Equals [!Ref CognitoDomainPrefix, ""]

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        ALLOWED_ORIGINS: !Ref AllowedOrigin
        WEB_URL: !Ref WebUrl
        REPORTS_TABLE: !Ref ReportsTable
        EVENTS_TABLE: !Ref EventsTable
        TOKENS_TABLE: !Ref TokensTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        WEB_BUCKET: !Ref WebBucket
        REVIEW_TIMEOUT_SECONDS: !Ref ReviewTimeoutSeconds
        STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:fixflow-report-workflow-${Stage}"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}"
              audience:
                - !Ref AdminUserPoolClient
            IdentitySource: "$request.header.Authorization"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.health.app.handler
      Description: Shallow liveness check. Does not call downstream services.
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.create_upload_url.app.handler
      Description: Create a five-minute presigned POST for report evidence.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/incoming/*"
      Events:
        CreateUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reports/upload-url
            Method: POST

  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.submit_report.app.handler
      Description: Validate a report, verify evidence, and create the report atomically.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt ReportEventsTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${EvidenceBucket.Arn}/incoming/*"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !GetAtt ReportWorkflowStateMachine.Arn
      Events:
        SubmitReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reports
            Method: POST

  GetPublicReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_public_report.app.handler
      Description: Resolve a public reference and return the filtered projection.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ReportsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${ReportsTable.Arn}/index/GSI2"
      Events:
        GetPublicReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /public/reports/{publicRef}
            Method: GET

  GetPublicEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_public_events.app.handler
      Description: Return only the public events for a tracked report.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ReportsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${ReportsTable.Arn}/index/GSI2"
                - !GetAtt ReportEventsTable.Arn
      Events:
        GetPublicEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /public/reports/{publicRef}/events
            Method: GET

  ValidateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.validate_report.app.handler
      Description: Workflow validation step. Returns a business result, not an error.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ReportsTable.Arn

  CalculatePriorityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.calculate_priority.app.handler
      Description: Apply the published deterministic priority score.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt ReportEventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ReportEventsTable.Arn

  TransitionReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.transition_report.app.handler
      Description: Apply a lifecycle transition and append its event atomically.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt ReportEventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ReportEventsTable.Arn

  StoreTaskTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.store_task_token.app.handler
      Description: Persist a Step Functions callback token before waiting.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt WorkflowTokensTable.Arn

  RecordWorkflowFailureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.record_workflow_failure.app.handler
      Description: Record a workflow failure without changing the lifecycle status.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt ReportEventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ReportEventsTable.Arn

  ReviewReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.review_report.app.handler
      Description: Apply an administrator decision, consume the token, and resume the workflow.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt ReportEventsTable.Arn
                - !GetAtt WorkflowTokensTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ReportEventsTable.Arn
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:*"
      Events:
        ReviewDecision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/reports/{reportId}/decision
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/fixflow-report-workflow-${Stage}"
      RetentionInDays: 14

  ReportWorkflowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "fixflow-report-workflow-${Stage}"
      Type: STANDARD
      DefinitionUri: ../backend/statemachines/report_workflow.asl.json
      DefinitionSubstitutions:
        ValidateReportFunctionArn: !GetAtt ValidateReportFunction.Arn
        CalculatePriorityFunctionArn: !GetAtt CalculatePriorityFunction.Arn
        TransitionReportFunctionArn: !GetAtt TransitionReportFunction.Arn
        StoreTaskTokenFunctionArn: !GetAtt StoreTaskTokenFunction.Arn
        RecordWorkflowFailureFunctionArn: !GetAtt RecordWorkflowFailureFunction.Arn
        ReviewTimeoutSeconds: !Ref ReviewTimeoutSeconds
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR
      Tracing:
        Enabled: true
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ValidateReportFunction.Arn
                - !GetAtt CalculatePriorityFunction.Arn
                - !GetAtt TransitionReportFunction.Arn
                - !GetAtt StoreTaskTokenFunction.Arn
                - !GetAtt RecordWorkflowFailureFunction.Arn
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "${WorkflowLogGroup.Arn}:*"

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - publicRef
              - category
              - severity
              - priority
              - priorityScore
              - status
              - area
              - assignedTeam
              - createdAt
              - updatedAt
              - dataSource
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - publicRef
              - category
              - severity
              - priority
              - priorityScore
              - status
              - area
              - assignedTeam
              - createdAt
              - updatedAt
              - dataSource
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: fixflow

  ReportEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: fixflow

  WorkflowTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: taskType
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
        - AttributeName: taskType
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: fixflow

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Service
          Value: fixflow

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - x-amz-meta-report-id
              - x-amz-meta-upload-id
              - x-amz-meta-purpose
            AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireIncomingUploads
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireNoncurrentEvidenceVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Service
          Value: fixflow

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "fixflow-web-oac-${AWS::AccountId}-${AWS::Region}"
        Description: Read-only access to the private FixFlow web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "fixflow-security-headers-${Stage}"
        Comment: Baseline browser security headers for the FixFlow SPA
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'self'; base-uri 'self'; object-src 'none';
                frame-ancestors 'none'; img-src 'self' data: blob:
                https://*.amazonaws.com; script-src 'self'; style-src 'self'
                'unsafe-inline'; font-src 'self'; connect-src 'self'
                ${ApiUrl} https://*.amazonaws.com
                https://*.amazoncognito.com; form-action 'self'
              - ApiUrl: !GetAtt HttpApi.ApiEndpoint
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FixFlow web application
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FixFlowWebOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FixFlowWebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "fixflow-admins-${Stage}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      DeletionProtection: INACTIVE

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: fixflow-admin-web
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "${AllowedOrigin}/auth/callback"
      LogoutURLs:
        - !Ref AllowedOrigin
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - UseGeneratedCognitoDomain
        - !Sub "fixflow-${AWS::AccountId}"
        - !Ref CognitoDomainPrefix
      UserPoolId: !Ref AdminUserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: FixFlow administrators
      Precedence: 1
      UserPoolId: !Ref AdminUserPool

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint

  ReportWorkflowStateMachineArn:
    Description: ARN of the report Step Functions state machine.
    Value: !Ref ReportWorkflowStateMachine

  ReportsTableName:
    Description: DynamoDB table for current report state.
    Value: !Ref ReportsTable

  ReportEventsTableName:
    Description: DynamoDB table for the append-only event history.
    Value: !Ref ReportEventsTable

  WorkflowTokensTableName:
    Description: DynamoDB table for short-lived Step Functions task tokens.
    Value: !Ref WorkflowTokensTable

  WebBucketName:
    Description: Private S3 bucket that holds the built frontend.
    Value: !Ref WebBucket

  EvidenceBucketName:
    Description: Private S3 bucket for report and resolution evidence.
    Value: !Ref EvidenceBucket

  DistributionId:
    Description: CloudFront distribution ID, used for cache invalidations.
    Value: !Ref WebDistribution

  WebUrl:
    Description: Public URL of the frontend.
    Value: !Sub "https://${WebDistribution.DomainName}"

  AdminUserPoolId:
    Description: Cognito user pool for administrators.
    Value: !Ref AdminUserPool

  AdminUserPoolClientId:
    Description: Public SPA app client ID.
    Value: !Ref AdminUserPoolClient

  CognitoHostedUiUrl:
    Description: Cognito hosted UI base URL.
    Value: !Sub "https://${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
