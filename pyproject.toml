[project]
name = "fixflow"
version = "0.1.0"
description = "FixFlow serverless civic issue reporting backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
  "moto[dynamodb,s3]>=5.0",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "functions", "tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
